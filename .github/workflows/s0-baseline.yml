name: S0 baseline

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  web-console-baseline:
    name: Web console baseline
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build web console
        run: cargo build -p coolzhu-web-console
      - name: Replay six S0 cases and three fixture rejections
        shell: pwsh
        run: |
          python tests/integration/s0_controlled_replay.py `
            --web-binary target/debug/coolzhu-web-console.exe `
            --output-dir "$env:RUNNER_TEMP/s0-controlled-replay" `
            --all
      - name: Run web console regression tests
        # 多项 Windows 进程测试会启动 PowerShell；并发冷启动会挤占启动期限。
        # 串行执行保留原有超时、取消和进程树清理断言，不放宽生产保护。
        run: cargo test -p coolzhu-web-console --bin coolzhu-web-console -- --test-threads=1
      - name: Verify S0 fixture contract
        run: cargo test --test s0_fixture_contract
      - name: Verify workspace linkage
        run: cargo test --test module_linkage_smoke
