<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车 · Pelican Cycling Loop</title>
<style>
  html,body{margin:0;padding:0;background:#10222e;display:flex;align-items:center;justify-content:center;height:100vh}
  svg{max-width:100vw;max-height:100vh;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:8px}
  text{-user-select:none}
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3f4"/>
      <stop offset="70%" stop-color="#cdeffb"/>
      <stop offset="100%" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#7c7c7c"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcf7d"/>
      <stop offset="100%" stop-color="#f5a83c"/>
    </linearGradient>

    <!-- 远山：800px 周期无缝图案 -->
    <g id="hills">
      <path d="M0,382 Q100,318 200,382 T400,382 T600,382 T800,382 L800,432 L0,432 Z" fill="#8fc98f"/>
      <path d="M0,398 Q130,352 260,398 T520,398 T780,398 L800,398 L800,432 L0,432 Z" fill="#6faf72"/>
    </g>

    <!-- 云朵：800px 周期 -->
    <g id="cloudset" fill="#ffffff" opacity="0.92">
      <g transform="translate(90,80)">
        <ellipse cx="0" cy="0" rx="38" ry="16"/><ellipse cx="28" cy="-9" rx="26" ry="14"/><ellipse cx="-26" cy="-6" rx="22" ry="12"/>
      </g>
      <g transform="translate(400,52) scale(0.8)">
        <ellipse cx="0" cy="0" rx="38" ry="16"/><ellipse cx="30" cy="-8" rx="24" ry="13"/><ellipse cx="-28" cy="-5" rx="20" ry="11"/>
      </g>
      <g transform="translate(650,110) scale(0.9)">
        <ellipse cx="0" cy="0" rx="36" ry="15"/><ellipse cx="26" cy="-9" rx="24" ry="12"/><ellipse cx="-26" cy="-5" rx="20" ry="11"/>
      </g>
    </g>

    <!-- 路边灌木：800px 周期（较快视差） -->
    <g id="bushes">
      <g transform="translate(130,414)">
        <ellipse cx="0" cy="0" rx="26" ry="16" fill="#3f7d46"/><ellipse cx="22" cy="4" rx="18" ry="12" fill="#4c8c52"/>
      </g>
      <g transform="translate(430,412)">
        <ellipse cx="0" cy="0" rx="30" ry="18" fill="#3f7d46"/><ellipse cx="-26" cy="5" rx="18" ry="12" fill="#55a05b"/>
      </g>
      <g transform="translate(690,415)">
        <ellipse cx="0" cy="0" rx="22" ry="14" fill="#4c8c52"/><ellipse cx="18" cy="3" rx="16" ry="10" fill="#3f7d46"/>
      </g>
    </g>

    <!-- 一只车轮：辐条旋转 -->
    <g id="wheel">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
        <g stroke="#d8d8d8" stroke-width="3">
          <line x1="-42" y1="0" x2="42" y2="0"/>
          <line x1="0" y1="-42" x2="0" y2="42"/>
          <line x1="-30" y1="-30" x2="30" y2="30"/>
          <line x1="-30" y1="30" x2="30" y2="-30"/>
        </g>
        <circle r="42" fill="none" stroke="#bbbbbb" stroke-width="4"/>
      </g>
      <circle r="46" fill="none" stroke="#1d1d1f" stroke-width="9"/>
      <circle r="7" fill="#444" stroke="#222" stroke-width="3"/>
    </g>

    <!-- 鹈鹕近侧腿 8 个踩踏姿态（脚端落在脚踏圆周上，与曲柄同相） -->
    <!-- 髋(362,292) 曲柄中心(392,392) 脚踏半径24 -->
</defs>

  <!-- ================= 背景 ================= -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="700" cy="70" r="34" fill="#ffe36b" stroke="#ffd23f" stroke-width="6"/>

  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="22s" repeatCount="indefinite"/>
    <use href="#hills"/><use href="#hills" x="800"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="16s" repeatCount="indefinite"/>
    <use href="#cloudset"/><use href="#cloudset" x="800"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="4s" repeatCount="indefinite"/>
    <use href="#bushes"/><use href="#bushes" x="800"/>
  </g>

  <!-- ================= 道路 ================= -->
  <rect x="0" y="430" width="800" height="42" fill="url(#road)"/>
  <rect x="0" y="472" width="800" height="28" fill="#5e8f4f"/>
  <line x1="0" y1="431" x2="800" y2="431" stroke="#efefef" stroke-width="3"/>
  <line x1="-60" y1="452" x2="860" y2="452" stroke="#f4f4f4" stroke-width="6" stroke-dasharray="44 24">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="0.283s" repeatCount="indefinite"/>
  </line>

  <!-- ================= 自行车 ================= -->
  <g id="bike">
    <use href="#wheel" x="255" y="384"/>
    <use href="#wheel" x="525" y="384"/>

    <!-- 车架 -->
    <g stroke="#c62f2f" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="392" y1="392" x2="352" y2="290"/>   <!-- 座管 -->
      <line x1="352" y1="290" x2="478" y2="298"/>   <!-- 上管 -->
      <line x1="392" y1="392" x2="483" y2="316"/>   <!-- 下管 -->
      <line x1="392" y1="392" x2="255" y2="384"/>   <!-- 后下又 -->
      <line x1="352" y1="290" x2="255" y2="384"/>   <!-- 后上又 -->
      <line x1="478" y1="296" x2="487" y2="322"/>   <!-- 头管 -->
      <path d="M487,320 Q505,342 525,384"/>          <!-- 前叉 -->
    </g>
    <!-- 车把与坐垫 -->
    <path d="M478,297 Q468,282 452,286" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M326,282 Q350,272 366,282 L360,288 Q344,282 332,288 Z" fill="#333"/>

    <!-- 链条与齿盘 -->
    <g stroke="#555" stroke-width="3" fill="none" stroke-dasharray="6 5">
      <line x1="255" y1="376" x2="392" y2="378">
        <animate attributeName="stroke-dashoffset" from="0" to="-11" dur="0.05s" repeatCount="indefinite"/>
      </line>
      <line x1="255" y1="392" x2="392" y2="406">
        <animate attributeName="stroke-dashoffset" from="0" to="11" dur="0.05s" repeatCount="indefinite"/>
      </line>
    </g>
    <circle cx="255" cy="384" r="8" fill="none" stroke="#444" stroke-width="4"/>
    <circle cx="392" cy="392" r="15" fill="none" stroke="#e8b93c" stroke-width="5"/>

    <!-- 曲柄（1.2s 一圈，与腿部动画同周期同相位） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 392 392" to="360 392 392" dur="1.2s" repeatCount="indefinite"/>
      <line x1="392" y1="392" x2="416" y2="392" stroke="#222" stroke-width="6" stroke-linecap="round"/>
      <line x1="392" y1="392" x2="368" y2="392" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    </g>
    <circle cx="392" cy="392" r="4" fill="#222"/>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <!-- 远侧腿（相位差 180°，颜色更深，位于身体之后；腿长按 L1=66/L2=64 的 IK 解，髋(362,292)、曲柄(392,392)、r=24） -->
  <g id="farLeg">
    <path fill="none" stroke="#c97b1e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
      d="M362,292 L406,341 L368,392">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
        values="M362,292 L406,341 L368,392;
                M362,292 L418,327 L375,375;
                M362,292 L425,313 L392,368;
                M362,292 L425,313 L409,375;
                M362,292 L417,328 L416,392;
                M362,292 L401,346 L409,409;
                M362,292 L389,352 L392,416;
                M362,292 L396,349 L375,409;
                M362,292 L406,341 L368,392"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 392 392" to="360 392 392" dur="1.2s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 368 392" to="-360 368 392" dur="1.2s" repeatCount="indefinite"/>
        <!-- 远侧脚踏板 + 蹼足（画在 180° 脚踏位，与远侧腿首帧一致） -->
        <rect x="356" y="389" width="24" height="6" rx="2" fill="#444"/>
        <path d="M358,388 Q368,378 382,384 Q378,390 368,390 Z" fill="#c97b1e"/>
      </g>
    </g>
  </g>

  <!-- 身体上下起伏组（躯干+头颈+翅膀） -->
  <g id="torso">
    <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite" calcMode="linear"
      values="0,0; 0,3; 0,0; 0,3; 0,0"/>

    <!-- 尾羽 -->
    <path d="M296,304 L252,290 L258,314 L246,320 L292,334 Z" fill="#e9e9ef" stroke="#c9c9d4" stroke-width="2"/>
    <!-- 躯干 -->
    <ellipse cx="348" cy="316" rx="60" ry="41" fill="#f4f4f8" stroke="#d9d9e3" stroke-width="2"/>
    <!-- 颈部 -->
    <path d="M382,302 C392,262 392,246 400,230" fill="none" stroke="#f4f4f8" stroke-width="24" stroke-linecap="round"/>
    <!-- 头部 -->
    <circle cx="404" cy="226" r="19" fill="#f4f4f8" stroke="#d9d9e3" stroke-width="2"/>
    <!-- 冠羽 -->
    <path d="M392,210 Q396,200 404,204 Q402,196 410,199" fill="none" stroke="#d9d9e3" stroke-width="3" stroke-linecap="round"/>
    <!-- 眼睛 -->
    <circle cx="410" cy="221" r="3.4" fill="#1d1d1f"/>
    <circle cx="411" cy="220" r="1.1" fill="#fff"/>

    <!-- 长喙：上喙 -->
    <path d="M420,220 Q468,224 508,238 Q470,236 420,231 Z" fill="#f2a33c" stroke="#d9822a" stroke-width="2" stroke-linejoin="round"/>
    <!-- 下喙 -->
    <path d="M420,232 Q466,238 506,239" fill="none" stroke="#d9822a" stroke-width="4" stroke-linecap="round"/>
    <!-- 喉囊（轻微鼓动） -->
    <path fill="url(#pouch)" stroke="#d9822a" stroke-width="2"
      d="M421,232 Q440,272 468,262 Q492,252 505,239 Q464,240 421,232 Z">
      <animate attributeName="d" dur="2.4s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
        values="M421,232 Q440,272 468,262 Q492,252 505,239 Q464,240 421,232 Z;
                M421,232 Q437,258 464,252 Q488,246 505,239 Q464,240 421,232 Z;
                M421,232 Q440,272 468,262 Q492,252 505,239 Q464,240 421,232 Z"/>
    </path>

    <!-- 折叠的翅膀（小幅扇动） -->
    <g id="wing">
      <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite" calcMode="linear"
        values="-3 352 296; 6 352 296; -3 352 296; 6 352 296; -3 352 296"/>
      <path d="M316,296 Q300,332 326,348 Q368,356 388,330 Q356,338 338,322 Q324,310 316,296 Z"
        fill="#dcdce6" stroke="#bdbdc9" stroke-width="2"/>
      <path d="M330,320 Q348,332 372,330" fill="none" stroke="#bdbdc9" stroke-width="2"/>
      <path d="M326,332 Q346,344 366,340" fill="none" stroke="#bdbdc9" stroke-width="2"/>
    </g>
  </g>

  <!-- 近侧腿（脚端与近侧脚踏同相：t=0 在 0° 脚踏位；腿长恒定 L1=66/L2=64 的 IK 解） -->
  <g id="nearLeg">
    <path fill="none" stroke="#e8952f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
      d="M362,292 L417,328 L416,392">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
        values="M362,292 L417,328 L416,392;
                M362,292 L401,346 L409,409;
                M362,292 L389,352 L392,416;
                M362,292 L396,349 L375,409;
                M362,292 L406,341 L368,392;
                M362,292 L418,327 L375,375;
                M362,292 L425,313 L392,368;
                M362,292 L425,313 L409,375;
                M362,292 L417,328 L416,392"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 392 392" to="360 392 392" dur="1.2s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 416 392" to="-360 416 392" dur="1.2s" repeatCount="indefinite"/>
        <!-- 蹼足 + 脚踏板 -->
        <rect x="404" y="389" width="24" height="6" rx="2" fill="#222"/>
        <path d="M406,388 Q416,378 430,384 Q426,390 416,390 Z" fill="#e8952f" stroke="#c97b1e" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- 骑行小提示 -->
  <text x="400" y="492" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e8f4fa" opacity="0.8">
    Pelican Cycling — pure SVG loop · no scripts · no external assets
  </text>
</svg>
</body>
</html>
