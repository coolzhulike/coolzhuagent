<!doctype html><meta charset="utf-8"><title>OOP-BOUNDARY switch</title><style>
body{font:18px system-ui;background:#edf5e9;color:#153c25;margin:16px}button{padding:12px}.frame{position:relative;margin-top:18px}iframe{display:block;width:calc(100% - 8px);height:320px;border:3px solid #247}</style>
<h2>OOP-PARENT switch</h2><p>父点击计数：0</p><button id="switch">切换子页面</button><div class="frame"><iframe id="child" title="跨站点子页面" src="http://localhost:PORT/child.html"></iframe></div><script>document.getElementById('switch').onclick=e=>{document.getElementById('child').src='http://localhost:PORT/replacement.html';fetch('/event',{method:'POST',body:JSON.stringify({kind:'setup-switch',trusted:e.isTrusted})})};</script>
