[package]
name = "coolzhu-tauri-shell"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata.tauri]
config-path = "tauri.conf.json"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
diagnostics = { package = "coolzhu-diagnostics", path = "../../../../diagnostics/packages/diagnostics" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
png = "0.17"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
