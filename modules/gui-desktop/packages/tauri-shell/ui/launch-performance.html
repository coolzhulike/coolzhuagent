<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>酷朱 · 山水启卷</title>
    <link rel="stylesheet" href="./launch-performance.css">
  </head>
  <body>
    <main id="launch-performance" aria-label="酷朱山水卷轴启动演出">
      <canvas id="launch-performance-canvas" aria-hidden="true"></canvas>
      <button id="launch-performance-skip" type="button" data-skip-launch aria-label="跳过启动演出" title="跳过启动演出">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m5 5 8 7-8 7M19 5v14" />
        </svg>
      </button>
    </main>
    <div id="startup-backend-status" hidden style="position:fixed;inset:0;display:grid;place-content:center;gap:18px;text-align:center;background:#071710;color:#ead49a;font:18px system-ui;z-index:10">
      <p id="startup-backend-message">正在载入工程与会话…</p>
      <button id="startup-backend-retry" hidden onclick="this.hidden=true;window.__TAURI__.core.invoke('show_console_command')">重试连接</button>
      <button onclick="window.__TAURI__.core.invoke('quit_app')">退出</button>
    </div>
    <style>#startup-backend-status[hidden]{display:none!important}</style>
    <!-- 同一幅卷轴展开，保留原COOLZHU字形与Q版整人姿态；不再逐字书写。 -->
    <script defer src="./scroll-startup-player.js"></script>
    <script defer src="./coolzhu-seven-letter-manifest.js"></script>
    <script defer src="./coolzhu-seven-letter-bridge.js"></script>
  </body>
</html>
