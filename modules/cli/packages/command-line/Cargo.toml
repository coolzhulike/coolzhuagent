[package]
name = "coolzhu-command-line"
version = "0.2.17"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "coolzhu-cli"
path = "src/main.rs"

[dependencies]
api.workspace = true
commands.workspace = true
compat-harness.workspace = true
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
runtime.workspace = true
plugins.workspace = true
serde_json.workspace = true
syntect = "5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "signal", "macros", "net", "io-util"] }
tools.workspace = true

[lints]
workspace = true
