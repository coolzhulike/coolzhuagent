[package]
name = "coolzhu-computer-use-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true


[lib]
name = "computer_use"
[dependencies]
runtime.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"

# 原生线程/管道监督接口（有界管道读取、同步 I/O 取消、残留登记）。
# 该 crate 是 `#![cfg(windows)]`：受控输入本身就是 Windows 专用路径，其他平台拿到空 crate。
[target.'cfg(windows)'.dependencies]
windows-process-guard = { package = "coolzhu-windows-process-guard", path = "../../../gui-web/packages/windows-process-guard" }

[dev-dependencies]
# 8.3c-A Phase 1：READY 等待/校验的用例需要临时目录。
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[[bin]]
name = "coolzhu-computer-use-check"
path = "src/bin/check.rs"

[lints]
workspace = true
